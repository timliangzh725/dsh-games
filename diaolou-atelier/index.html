<style id="dl-landing-style">
  dialog#dl-landing{
    position:fixed; inset:0; margin:0; padding:0; border:0;
    width:100vw; height:100vh; max-width:none; max-height:none;
    background:#f4efe6; color:#463726; overflow:hidden; z-index:9999;
    display:flex; flex-direction:column;
  }
  dialog#dl-landing::backdrop{ background:transparent; }
  dialog#dl-landing.dl-leaving{ opacity:0; transition:opacity .28s ease; pointer-events:none; }
  #dl-landing .dl-grain{
    position:absolute; inset:0; pointer-events:none; opacity:.5;
    background-image:radial-gradient(#d9cbb4 0.5px, transparent 0.6px);
    background-size:3px 3px;
  }
  #dl-landing .dl-top{
    position:relative; display:flex; align-items:baseline; justify-content:space-between;
    gap:20px; padding:26px 46px 0;
  }
  #dl-landing .dl-brand{ display:flex; align-items:center; gap:12px; }
  #dl-landing .dl-brand img{ width:40px; height:40px; object-fit:contain; }
  #dl-landing .dl-brand strong{
    font-family:"Songti SC","Noto Serif SC","Source Han Serif SC",serif;
    font-size:17px; letter-spacing:.14em; font-weight:700;
  }
  #dl-landing .dl-brand span{
    display:block; margin-top:3px; color:#94836c; font-size:10px; letter-spacing:.22em;
  }
  #dl-landing .dl-chapter{ color:#94836c; font-size:10px; letter-spacing:.28em; }

  #dl-landing .dl-main{
    position:relative; flex:1; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.04fr);
    align-items:center; gap:64px; padding:0 46px;
  }
  #dl-landing .dl-kicker{
    display:flex; align-items:center; gap:12px;
    color:#a08d72; font-size:10px; letter-spacing:.3em;
  }
  #dl-landing .dl-kicker::before{ content:""; width:34px; height:1px; background:#cbb99e; }
  #dl-landing h1.dl-title{
    margin:18px 0 0; font-family:"Songti SC","Noto Serif SC","Source Han Serif SC",serif;
    font-size:clamp(44px,5.4vw,76px); line-height:1.08; letter-spacing:.06em; font-weight:700;
    color:#3f3123;
  }
  #dl-landing .dl-sub{
    margin:16px 0 0; color:#8a7658; font-size:12px; letter-spacing:.34em;
  }
  #dl-landing .dl-lead{
    margin:26px 0 0; max-width:34em; color:#5c4b36;
    font-size:15px; line-height:2; letter-spacing:.02em;
  }
  #dl-landing .dl-note{
    margin:14px 0 0; max-width:34em; color:#94836c;
    font-size:12px; line-height:1.95;
  }
  #dl-landing .dl-actions{ display:flex; align-items:center; gap:14px; margin-top:34px; flex-wrap:wrap; }
  #dl-landing .dl-start{
    appearance:none; border:1px solid #6f5538; background:#6f5538; color:#fbf6ec;
    padding:15px 30px; font-size:14px; letter-spacing:.22em; cursor:pointer;
    font-family:inherit; transition:background .18s ease, transform .18s ease;
  }
  #dl-landing .dl-start:hover{ background:#5d4630; transform:translateY(-1px); }
  #dl-landing .dl-start:focus-visible{ outline:2px solid #a98a5f; outline-offset:3px; }
  #dl-landing .dl-second{
    appearance:none; border:1px solid #cdbda2; background:transparent; color:#7a6244;
    padding:15px 22px; font-size:13px; letter-spacing:.16em; cursor:pointer; font-family:inherit;
  }
  #dl-landing .dl-second:hover{ border-color:#a98a5f; color:#5d4630; }
  #dl-landing .dl-meta{
    margin-top:30px; padding-top:14px; border-top:1px solid #e2d6c3; max-width:34em;
    color:#a2937c; font-size:10px; letter-spacing:.2em; line-height:1.9;
  }

  #dl-landing .dl-art{ position:relative; max-width:640px; justify-self:end; width:100%; }
  #dl-landing .dl-frame{
    position:relative; border:1px solid #d8c9b0; background:#efe6d7;
    box-shadow:0 26px 60px -38px rgba(63,49,35,.55);
  }
  #dl-landing .dl-frame img{ display:block; width:100%; height:auto; }
  #dl-landing .dl-frame figcaption{
    display:flex; justify-content:space-between; gap:14px;
    padding:10px 12px; border-top:1px solid #d8c9b0;
    color:#9a8770; font-size:9px; letter-spacing:.2em;
  }
  #dl-landing .dl-sketch{ position:absolute; left:-26px; bottom:-34px; width:96px; opacity:.9; }
  #dl-landing .dl-sketch img{ width:100%; height:auto; display:block; }

  #dl-landing .dl-foot{
    position:relative; display:flex; justify-content:space-between; gap:18px;
    padding:0 46px 22px; color:#a2937c; font-size:9px; letter-spacing:.2em;
  }

  @media (max-width:960px){
    #dl-landing .dl-main{ grid-template-columns:1fr; gap:26px; align-content:center; padding:0 26px; }
    #dl-landing .dl-art{ display:none; }
    #dl-landing .dl-top{ padding:20px 26px 0; }
    #dl-landing .dl-foot{ padding:0 26px 16px; }
    #dl-landing h1.dl-title{ font-size:44px; }
    #dl-landing .dl-lead{ font-size:14px; }
  }
  @media (max-height:640px){
    #dl-landing .dl-note, #dl-landing .dl-meta{ display:none; }
    #dl-landing .dl-title{ margin-top:10px; }
    #dl-landing .dl-actions{ margin-top:20px; }
  }
</style>

      <p class="dl-kicker">THE VILLAGE · 1925</p>
      <h1 class="dl-title" id="dl-landing-title">碉楼营造局</h1>
      <p class="dl-sub">铺一条路，筑几座楼</p>
      <p class="dl-lead">
        走进民国侨乡的一座新村：从村口那条土路开始，修路、建碉楼、开商铺，
        与归乡的乡亲往来交易，把一个荒坡慢慢经营成村子。
      </p>
      <p class="dl-note">
        每 45 秒结算一天，第 5 天防盗、第 9 天防洪、第 12 天赶集。
        第二篇章《雨前补屋》以一封银信切入，在同一个侨乡里修一间旧屋。
      </p>

<script id="dl-landing-script">
(function () {
  var dlg = document.getElementById('dl-landing');
  if (!dlg) return;
  var start = document.getElementById('dl-start');
  var hist = document.getElementById('dl-history');
  var leaving = false;
  function go() {
    if (leaving) return;
    leaving = true;
    try { start.textContent = '正在铺开村落…'; start.setAttribute('aria-busy','true'); } catch (e) {}
    try { dlg.classList.add('dl-leaving'); } catch (e) {}
    try { location.href = './town.html'; } catch (e) {}
  }
  start && start.addEventListener('click', function (e) { e.preventDefault(); go(); });
  hist && hist.addEventListener('click', function (e) { e.preventDefault(); try { location.href = './history.html'; } catch (err) {} });
  document.addEventListener('keydown', function (e) {
    if (leaving) return;
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); }
  }, true);
  setTimeout(function () { try { start && start.focus({ preventScroll: true }); } catch (e) {} }, 60);
})();
</script>
