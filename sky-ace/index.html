<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080c13">
<title>铁翼苍穹 · LOSUN STORE</title>
<meta name="description" content="冷黎明，峡湾跑道，拉起来就是战场">
<style>
  :root{--accent:#7fd3f7; --accent2:#2f5a75; --ink:#f4f7fb; --dim:#9aa7b6; --line:rgba(255,255,255,.12)}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:#070b11; color:var(--ink); overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .hero{position:fixed; inset:0; overflow:hidden; z-index:0}
  .hero img{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    object-position:center 50%; transform:scale(1.03);
    filter:saturate(1.08) brightness(1.12) contrast(1.02);
  }
  .veil{position:fixed; inset:0; z-index:1; pointer-events:none;
    background:
      linear-gradient(96deg, rgba(6,10,17,.99) 0%, rgba(6,10,17,.975) 18%, rgba(6,10,17,.94) 34%, rgba(6,10,17,.70) 52%, rgba(6,10,17,.26) 70%, rgba(6,10,17,.06) 100%),
      radial-gradient(70% 90% at 6% 8%, #7fd3f71f 0%, transparent 60%),
      radial-gradient(70% 75% at 0% 100%, rgba(5,8,13,.9) 0%, rgba(5,8,13,.45) 42%, transparent 66%),
      linear-gradient(0deg, rgba(5,8,13,.9) 0%, rgba(5,8,13,.22) 30%, transparent 55%),
      linear-gradient(180deg, rgba(5,8,13,.55) 0%, transparent 22%);
  }
  .grain{position:fixed; inset:0; z-index:2; pointer-events:none; opacity:.35;
    background-image:linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
    background-size:80px 80px;
    mask-image:radial-gradient(120% 90% at 20% 40%, #000 20%, transparent 72%);
  }
  main{position:relative; z-index:3; height:100%; display:flex; align-items:center; padding:0 clamp(26px,5.2vw,80px)}
  .copy{max-width:640px}
  .badges{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  .badge{font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:#aebbcb; border:1px solid var(--line); border-radius:999px; padding:6px 12px; white-space:nowrap; backdrop-filter:blur(4px)}
  .badge.accent{color:var(--accent); border-color:#7fd3f75c; background:#7fd3f714}
  h1{margin:26px 0 0; font-size:clamp(36px,4.8vw,68px); line-height:1.03; letter-spacing:-.02em; font-weight:800; text-shadow:0 20px 70px rgba(0,0,0,.75)}
  .en{margin:15px 0 0; font-size:10.5px; letter-spacing:.36em; text-transform:uppercase; color:var(--accent)}
  .rule{width:58px; height:2px; margin:22px 0 0; background:linear-gradient(90deg,var(--accent),transparent)}
  .tag{margin:20px 0 0; font-size:clamp(15px,1.35vw,19px); line-height:1.62; color:#e2eaf4; max-width:30ch; text-shadow:0 6px 30px rgba(0,0,0,.6)}
  .desc{margin:13px 0 0; font-size:14px; line-height:1.95; color:#9fadbc; max-width:46ch; text-shadow:0 4px 22px rgba(0,0,0,.7)}
  .meta{display:flex; gap:34px; margin:28px 0 0; flex-wrap:wrap}
  .meta dt{font-size:9.5px; letter-spacing:.22em; text-transform:uppercase; color:#6c7a8b}
  .meta dd{margin:7px 0 0; font-size:13px; color:#cbd6e2; white-space:nowrap}
  .actions{display:flex; align-items:center; gap:18px; margin:32px 0 0; flex-wrap:wrap}
  .play{display:inline-flex; align-items:center; gap:12px; height:54px; padding:0 30px; border:0; border-radius:12px; cursor:pointer;
    font:inherit; font-weight:700; font-size:16px; color:#07121c; background:var(--accent);
    box-shadow:0 20px 55px -18px #7fd3f7bb, inset 0 1px 0 rgba(255,255,255,.4); transition:transform .16s ease, box-shadow .16s ease}
  .play:hover{transform:translateY(-1px); box-shadow:0 26px 65px -18px #7fd3f7dd, inset 0 1px 0 rgba(255,255,255,.45)}
  .play:focus-visible{outline:2px solid #fff; outline-offset:3px}
  .play .tri{width:0;height:0;border-left:9px solid #07121c;border-top:6px solid transparent;border-bottom:6px solid transparent}
  .hint{font-size:11.5px; color:#7f8d9e; line-height:1.7}
  .hint b{color:#a7b5c5; font-weight:600}
  .cap{position:fixed; right:clamp(18px,2.4vw,34px); bottom:clamp(16px,2.2vh,26px); z-index:3; text-align:right;
    font-size:9.5px; letter-spacing:.24em; text-transform:uppercase; color:rgba(225,234,244,.72); text-shadow:0 2px 14px rgba(0,0,0,.8)}
  .cap span{display:block; margin-top:5px; letter-spacing:.16em; color:rgba(225,234,244,.42)}
  .foot{position:fixed; left:clamp(26px,5.2vw,80px); bottom:clamp(16px,2.2vh,26px); z-index:3;
    font-size:9.5px; letter-spacing:.3em; text-transform:uppercase; color:rgba(220,232,244,.42)}
  body.leaving main,body.leaving .cap,body.leaving .foot{opacity:0; transform:translateY(-4px); transition:opacity .22s ease, transform .22s ease}
  @media (max-width:820px){
    .veil{background:
      linear-gradient(180deg, rgba(6,10,17,.55) 0%, rgba(6,10,17,.86) 34%, rgba(6,10,17,.97) 62%, rgba(6,10,17,.99) 100%),
      radial-gradient(80% 60% at 50% 8%, #7fd3f722 0%, transparent 62%);}
    .hero img{object-position:center 22%}
    main{align-items:flex-end; padding-bottom:clamp(56px,9vh,90px)}
    .desc{display:none}
    .meta{gap:22px; margin-top:20px}
    .foot{display:none}
  }
  @media (max-height:600px){
    h1{margin-top:14px}
    .tag{font-size:15px; margin-top:12px}
    .desc,.meta{display:none}
    .actions{margin-top:20px}
  }
</style>
</head>
<body>
<div class="hero"><img src="./cover.jpg" alt="铁翼苍穹 游戏画面"></div>
<div class="veil"></div><div class="grain"></div>
<main>
  <section class="copy">
    <div class="badges">
      <span class="badge">LOSUN STORE</span>
      <span class="badge">3D 立体</span><span class="badge">空战飞行</span><span class="badge accent">横屏</span>
    </div>
    <h1>铁翼苍穹</h1>
    <p class="en">XF-99 · STEALTH DOGFIGHT</p>
    <div class="rule"></div>
    <p class="tag">冷黎明，峡湾跑道，拉起来就是战场</p>
    <p class="desc">驾驶 XF-99 隐身战机：试飞、狗斗、反舰、降落四类科目。导弹、机炮与热焰诱饵在手，脱离战区会自动补给。</p>
    <dl class="meta"><div><dt>类型</dt><dd>空战飞行</dd></div><div><dt>操作</dt><dd>键鼠 / 触控</dd></div><div><dt>科目</dt><dd>4 类</dd></div></dl>
    <div class="actions">
      <button class="play" id="play" type="button"><span class="tri"></span>开始游戏</button>
      <p class="hint">浏览器直接畅玩 · 首次载入 0.9 MB<br><b>约 1–3 秒</b>，之后秒开</p>
    </div>
  </section>
</main>
<div class="cap">游戏画面 · IN-GAME<span>XF-99 · STEALTH DOGFIGHT</span></div>
<div class="foot">LOSUN STORE · 独立小游戏</div>
<script>
(function(){
  var btn = document.getElementById('play'), leaving = false;
  function go(){
    if (leaving) return; leaving = true;
    try { btn.textContent = '正在载入…'; btn.disabled = true; } catch(e){}
    document.body.classList.add('leaving');
    setTimeout(function(){ location.href = './play.html'; }, 140);
  }
  btn.addEventListener('click', go);
  document.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } }, true);
})();
</script>
</body>
</html>
