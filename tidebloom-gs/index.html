<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0f16">
<title>潮汐花岛 · LOSUN STORE</title>
<meta name="description" content="在暖光里，造一座会呼吸的微型海岛">
<style>
  :root{
    --accent:#f2a65e; --accent2:#7bc7d8;
    --ink:#f4f7fb; --dim:#8e9bab; --line:rgba(255,255,255,.10);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:#0a0e15; color:var(--ink); overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .bg{position:fixed;inset:0;overflow:hidden}
  .bg::before{
    content:""; position:absolute; inset:-10%;
    background-image:url("./cover.jpg");
    background-size:cover; background-position:center;
    filter:blur(54px) saturate(1.5) brightness(.62); transform:scale(1.18);
  }
  .bg::after{
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(120% 90% at 16% 20%, #f2a65e2e 0%, transparent 52%),
      radial-gradient(90% 80% at 88% 84%, #7bc7d830 0%, transparent 58%),
      linear-gradient(90deg, rgba(7,11,18,.97) 0%, rgba(7,11,18,.88) 38%, rgba(7,11,18,.55) 78%, rgba(7,11,18,.42) 100%);
  }
  .grid{
    position:fixed; inset:0; pointer-events:none; opacity:.5;
    background-image:linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
                     linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size:72px 72px;
    mask-image:radial-gradient(120% 80% at 50% 40%, #000 30%, transparent 78%);
  }
  main{
    position:relative; height:100%; display:grid; align-items:center; gap:56px;
    grid-template-columns:minmax(0,1.04fr) minmax(0,.96fr); padding:0 clamp(28px,5vw,72px);
  }
  .copy{max-width:620px}
  .badges{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  .badge{
    font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:#a9b6c6;
    border:1px solid var(--line); border-radius:999px; padding:6px 12px; white-space:nowrap;
  }
  .badge.accent{color:var(--accent); border-color:#f2a65e55; background:#f2a65e12}
  .store{font-size:9.5px; letter-spacing:.34em; color:#5f6c7c}
  h1{
    margin:26px 0 0; font-size:clamp(34px,4.6vw,64px); line-height:1.04; letter-spacing:-.02em;
    font-weight:800; text-shadow:0 18px 60px rgba(0,0,0,.6);
  }
  .en{
    margin:16px 0 0; font-size:10.5px; letter-spacing:.36em; text-transform:uppercase;
    color:var(--accent); opacity:.92;
  }
  .rule{width:56px; height:2px; margin:22px 0 0; background:linear-gradient(90deg,var(--accent),transparent)}
  .tag{margin:20px 0 0; font-size:clamp(15px,1.35vw,19px); line-height:1.6; color:#dbe4ef; max-width:30ch}
  .desc{margin:14px 0 0; font-size:14px; line-height:1.95; color:var(--dim); max-width:46ch}
  .meta{display:flex; gap:34px; margin:30px 0 0; flex-wrap:wrap}
  .meta div{min-width:0}
  .meta dt{font-size:9.5px; letter-spacing:.22em; text-transform:uppercase; color:#5f6c7c}
  .meta dd{margin:7px 0 0; font-size:13px; color:#c3cedb; white-space:nowrap}
  .actions{display:flex; align-items:center; gap:18px; margin:34px 0 0; flex-wrap:wrap}
  .play{
    display:inline-flex; align-items:center; gap:12px; height:54px; padding:0 30px;
    border:0; border-radius:12px; cursor:pointer; font:inherit; font-weight:700; font-size:16px;
    color:#08121c; background:var(--accent);
    box-shadow:0 18px 50px -18px #f2a65eaa, inset 0 1px 0 rgba(255,255,255,.35);
    transition:transform .16s ease, box-shadow .16s ease;
  }
  .play:hover{transform:translateY(-1px); box-shadow:0 24px 60px -18px #f2a65ecc, inset 0 1px 0 rgba(255,255,255,.4)}
  .play:focus-visible{outline:2px solid #fff; outline-offset:3px}
  .play .tri{width:0;height:0;border-left:9px solid #08121c;border-top:6px solid transparent;border-bottom:6px solid transparent}
  .hint{font-size:11.5px; color:#6f7d8f; line-height:1.7}
  .hint b{color:#9dabbb; font-weight:600}
  .foot{
    position:fixed; left:clamp(28px,5vw,72px); bottom:22px; font-size:9.5px; letter-spacing:.3em;
    text-transform:uppercase; color:#485464;
  }
  .art{position:relative; justify-self:end; width:100%; max-width:min(560px, calc(66vh * 16 / 9))}
  .art::before{content:""; position:absolute; inset:-14% -12%; background:radial-gradient(60% 60% at 50% 50%, #f2a65e30, transparent 70%); filter:blur(18px); z-index:0}
  .art .frame{position:relative; z-index:1; border-radius:16px}
  .art .frame{
    border:1px solid var(--line); overflow:hidden;
    box-shadow:0 50px 110px -50px rgba(0,0,0,.95), 0 0 0 1px rgba(255,255,255,.03) inset;
    background:#0d131c;
  }
  .art img{display:block; width:100%; height:auto; aspect-ratio:16/9; object-fit:cover}
  .art .cap{
    position:absolute; inset:auto 0 0 0; display:flex; justify-content:space-between; gap:10px;
    padding:12px 16px; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:#a3b0c0;
    background:linear-gradient(0deg, rgba(8,12,19,.92), rgba(8,12,19,0));
  }
  body.leaving main,body.leaving .art{opacity:0; transform:translateY(-4px); transition:opacity .22s ease, transform .22s ease}
  @media (max-width:900px){
    main{grid-template-columns:1fr; gap:26px; padding-top:clamp(24px,6vh,56px); padding-bottom:clamp(24px,6vh,56px); align-content:center}
    .art{justify-self:start; max-width:380px; order:-1}
    .art img{aspect-ratio:16/9}
    .desc{display:none}
    .meta{gap:22px; margin-top:22px}
  }
  @media (max-height:620px){
    h1{margin-top:16px}
    .tag{font-size:15px; margin-top:12px}
    .desc,.meta{display:none}
    .actions{margin-top:22px}
  }
</style>
</head>
<body class="">
<div class="bg"></div><div class="grid"></div>
<main>
  <section class="copy">
    <div class="badges">
      <span class="badge">LOSUN STORE</span>
      <span class="badge">3D 立体</span><span class="badge">休闲建造</span><span class="badge accent">横屏</span>
    </div>
    <h1>潮汐花岛</h1>
    <p class="en">TIDEBLOOM</p>
    <div class="rule"></div>
    <p class="tag">在暖光里，造一座会呼吸的微型海岛</p>
    <p class="desc">从一叶浅滩开始：抽卡换手，把种子、木石铺成环礁；任务书推着你一座座点亮沙洲，直到海角灯塔。</p>
    <dl class="meta">
      <div><dt>类型</dt><dd>卡牌建造</dd></div><div><dt>操作</dt><dd>点击 / 拖拽</dd></div><div><dt>一局</dt><dd>42 秒 × 多轮</dd></div>
    </dl>
    <div class="actions">
      <button class="play" id="play" type="button"><span class="tri"></span>开始游戏</button>
      <p class="hint">浏览器直接畅玩 · 首次载入 3.1 MB<br><b>约 3–5 秒</b>，之后秒开</p>
    </div>
  </section>
  <figure class="art">
    <div class="frame">
      <img src="./cover.jpg" alt="潮汐花岛 实机画面">
      <figcaption class="cap"><span>实机画面 · IN-GAME</span><span>横屏</span></figcaption>
    </div>
  </figure>
  <div class="foot">LOSUN STORE · 独立小游戏</div>
</main>
<script>
(function(){
  var btn = document.getElementById('play');
  var leaving = false;
  function go(){
    if (leaving) return; leaving = true;
    try { btn.innerHTML = '正在载入…'; btn.disabled = true; } catch(e){}
    document.body.classList.add('leaving');
    setTimeout(function(){ location.href = './play.html'; }, 140);
  }
  btn.addEventListener('click', go);
  document.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); }
  }, true);
})();
</script>
</body>
</html>
